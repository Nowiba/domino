<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dominoes — Classic Table Game</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;500;600;700&display=swap');

/* =====================================================================
   RESET & VARIABLES
===================================================================== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --felt:#1a6b3c; --felt-d:#0f3d22; --felt-dd:#071a0e;
  --gold:#c9a84c; --gold-l:#f0d278; --gold-d:#8a6520;
  --tile-bg:#faf5ea; --tile-bd:#c8b98a; --tile-dot:#1a1108; --tile-ln:#8b7050;
  --hl:#ffe84d; --hl-g:rgba(255,232,77,.55);
  --txt:#f0ead8; --txt-dim:rgba(228,210,165,.58); --txt-gold:#f0d278;
  --sh:0 4px 16px rgba(0,0,0,.5); --sh-lg:0 14px 44px rgba(0,0,0,.65);
  --r:9px; --r-lg:16px;
  --F:'Cinzel',Georgia,serif; --U:'Inter','Trebuchet MS',sans-serif;
  --ta:.16s; --tm:.3s; --ts:.5s;
}
html,body{width:100%;height:100%;overflow:hidden;font-family:var(--U);
  background:var(--felt-dd);color:var(--txt);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}

/* =====================================================================
   PARTICLE CANVAS
===================================================================== */
#pcv{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.3}

/* =====================================================================
   SCREENS
===================================================================== */
.sc{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  transition:opacity var(--ts),visibility var(--ts);z-index:10}
.sc.off{opacity:0;visibility:hidden;pointer-events:none}

/* =====================================================================
   LOADING SCREEN
===================================================================== */
#LS{background:var(--felt-dd);flex-direction:column;gap:20px;z-index:300}
.ll{font-family:var(--F);font-size:2.6rem;color:var(--gold-l);letter-spacing:.14em;
  text-align:center;animation:llPulse 1.3s ease infinite}
@keyframes llPulse{0%,100%{opacity:.55}50%{opacity:1}}
.lbw{width:220px;height:5px;background:rgba(255,255,255,.1);border-radius:5px;overflow:hidden}
.lb{height:100%;width:0%;background:linear-gradient(90deg,var(--gold-d),var(--gold-l));
  border-radius:5px;transition:width .06s linear}
.lt{font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;
  color:var(--txt-dim);text-align:center}

/* =====================================================================
   START MENU SCREEN
===================================================================== */
#MS{flex-direction:column;gap:16px;
  background:radial-gradient(ellipse at 50% 35%,#1f6a40 0%,#0e4224 50%,#050e07 100%)}
#MS::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 42% 28% at 18% 18%,rgba(201,168,76,.09) 0%,transparent 55%),
    radial-gradient(ellipse 32% 22% at 82% 78%,rgba(25,110,60,.13) 0%,transparent 55%)}
#MS::after{content:'';position:absolute;inset:0;pointer-events:none;
  background-image:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.028) 3px,rgba(0,0,0,.028) 4px),
    repeating-linear-gradient(90deg,transparent,transparent 3px,rgba(0,0,0,.028) 3px,rgba(0,0,0,.028) 4px)}

.logo{text-align:center;position:relative;z-index:1}
.logo h1{font-family:var(--F);font-size:clamp(2.5rem,7vw,4rem);letter-spacing:.13em;
  color:transparent;
  background:linear-gradient(155deg,#f5de82 0%,#c9a84c 40%,#e8c658 70%,#f8e490 100%);
  -webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 3px 22px rgba(201,168,76,.52));
  animation:shimmer 4s ease infinite}
@keyframes shimmer{0%,100%{filter:drop-shadow(0 3px 22px rgba(201,168,76,.52))}
  50%{filter:drop-shadow(0 3px 38px rgba(201,168,76,.88))}}
.logo p{font-size:clamp(.62rem,1.8vw,.8rem);letter-spacing:.32em;text-transform:uppercase;
  color:rgba(232,201,109,.42);margin-top:5px}

#deco{display:flex;gap:6px;justify-content:center;position:relative;z-index:1;
  animation:slideUp .7s ease .25s both}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.mp{background:rgba(4,16,8,.74);border:1px solid rgba(201,168,76,.2);
  border-radius:var(--r-lg);padding:22px 26px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  width:min(385px,93vw);display:flex;flex-direction:column;gap:10px;
  position:relative;z-index:1;box-shadow:var(--sh-lg),inset 0 1px 0 rgba(255,255,255,.04);
  animation:panelIn .55s ease .1s both}
@keyframes panelIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.mlbl{font-size:.63rem;letter-spacing:.3em;text-transform:uppercase;
  color:rgba(201,168,76,.58);margin-bottom:2px;font-weight:600}

.mbtn{width:100%;padding:13px 15px;
  background:linear-gradient(135deg,rgba(25,82,48,.78),rgba(11,42,24,.9));
  border:1px solid rgba(201,168,76,.18);border-radius:12px;
  color:var(--txt);font-size:.88rem;font-family:var(--U);cursor:pointer;
  transition:all var(--ta);text-align:left;
  display:flex;align-items:center;gap:12px;position:relative;overflow:hidden}
.mbtn::after{content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(201,168,76,.08) 0%,transparent 55%);
  opacity:0;transition:opacity var(--ta)}
.mbtn:hover{border-color:rgba(201,168,76,.52);transform:translateX(4px) scale(1.012);
  box-shadow:0 5px 22px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.04)}
.mbtn:hover::after{opacity:1}
.mbtn:active{transform:translateX(2px) scale(.99)}
.mbtn .mi{font-size:1.25rem;min-width:26px;flex-shrink:0}
.mbtn .mt{font-weight:700;color:var(--gold-l);display:block;font-size:.9rem}
.mbtn .md{font-size:.7rem;color:rgba(188,185,162,.65);display:block;margin-top:2px}
.mbtn .mbg{margin-left:auto;font-size:.6rem;letter-spacing:.1em;flex-shrink:0;
  background:rgba(201,168,76,.16);color:var(--gold-l);
  border:1px solid rgba(201,168,76,.28);border-radius:18px;padding:2px 8px}

.mfoot{display:flex;justify-content:center;gap:10px;position:relative;z-index:1}
.mfbtn{background:rgba(0,0,0,.38);border:1px solid rgba(255,255,255,.1);
  border-radius:8px;color:var(--txt-dim);font-size:.74rem;font-family:var(--U);
  padding:6px 14px;cursor:pointer;transition:all var(--ta);display:flex;align-items:center;gap:6px}
.mfbtn:hover{border-color:rgba(201,168,76,.35);color:var(--txt-gold)}

/* =====================================================================
   HUD
===================================================================== */
#hud{position:fixed;top:0;left:0;right:0;height:52px;
  background:rgba(4,12,6,.84);border-bottom:1px solid rgba(201,168,76,.16);
  display:flex;align-items:center;padding:0 14px;gap:10px;
  z-index:50;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 2px 18px rgba(0,0,0,.4)}
#hud-title{font-family:var(--F);font-size:.9rem;color:var(--gold-l);
  letter-spacing:.09em;white-space:nowrap;flex-shrink:0}
#hscores{display:flex;gap:5px;flex:1;overflow:hidden}
.chip{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.08);border-radius:22px;
  padding:4px 10px;font-size:.72rem;white-space:nowrap;
  transition:all var(--tm);flex-shrink:0;cursor:default}
.chip.act{background:rgba(201,168,76,.18);border-color:var(--gold);
  color:var(--gold-l);animation:chipGlow 2.2s ease infinite}
@keyframes chipGlow{0%,100%{box-shadow:0 0 7px rgba(201,168,76,.2)}
  50%{box-shadow:0 0 18px rgba(201,168,76,.5)}}
.chip .cn{font-weight:700;font-size:.74rem}
.chip .cs{background:rgba(0,0,0,.3);border-radius:10px;
  padding:1px 6px;font-size:.64rem;color:var(--gold-l);font-weight:600}
.chip .ct{font-size:.6rem;color:rgba(165,160,138,.5)}
.hbtns{display:flex;gap:6px;flex-shrink:0}
.hbtn{border-radius:8px;padding:5px 12px;font-size:.72rem;cursor:pointer;
  font-family:var(--U);font-weight:600;transition:all var(--ta);
  white-space:nowrap;border:1px solid}
#hbtn-menu{background:rgba(135,32,32,.72);border-color:rgba(215,75,75,.28);color:#f5c8c8}
#hbtn-menu:hover{background:rgba(180,48,48,.88);border-color:rgba(215,75,75,.6)}
#hbtn-snd{background:rgba(38,38,38,.72);border-color:rgba(115,112,90,.28);
  color:var(--txt-dim);min-width:34px;text-align:center}
#hbtn-snd:hover{background:rgba(58,58,55,.88);color:var(--txt)}

/* =====================================================================
   GAME SCREEN
===================================================================== */
#GS{flex-direction:column;
  background:radial-gradient(ellipse 110% 85% at 50% 28%,var(--felt) 0%,var(--felt-d) 55%,var(--felt-dd) 100%);
  overflow:hidden}
#GS::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image:repeating-linear-gradient(0deg,transparent,transparent 4px,rgba(0,0,0,.022) 4px,rgba(0,0,0,.022) 5px),
    repeating-linear-gradient(90deg,transparent,transparent 4px,rgba(0,0,0,.022) 4px,rgba(0,0,0,.022) 5px)}

/* Felt corner ornaments */
.fcorn{position:fixed;width:72px;height:72px;pointer-events:none;z-index:2;opacity:.2}
.fcorn svg{width:100%;height:100%}
.fc-tl{top:52px;left:0}
.fc-tr{top:52px;right:0;transform:scaleX(-1)}
.fc-bl{bottom:148px;left:0;transform:scaleY(-1)}
.fc-br{bottom:148px;right:0;transform:scale(-1)}

/* Turn badge */
#tbadge{position:fixed;top:62px;left:50%;transform:translateX(-50%);
  border-radius:24px;padding:5px 18px 5px 12px;font-size:.72rem;font-weight:700;
  letter-spacing:.1em;z-index:46;white-space:nowrap;
  transition:all var(--tm);border:1.5px solid;
  display:flex;align-items:center;gap:7px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#tbadge .tbdot{width:7px;height:7px;border-radius:50%;background:currentColor;
  animation:tbpulse 1.4s ease infinite;flex-shrink:0}
@keyframes tbpulse{0%,100%{opacity:.38;transform:scale(.78)}50%{opacity:1;transform:scale(1)}}
#tbadge.off{opacity:0;pointer-events:none}
#tbadge.yours{background:rgba(28,95,200,.24);border-color:#5bbeff;color:#8dd4ff}
#tbadge.theirs{background:rgba(178,138,28,.2);border-color:var(--gold);color:var(--gold-l)}

/* Table container */
#table{position:fixed;top:52px;left:0;right:0;bottom:0;overflow:hidden;z-index:1}

/* =====================================================================
   BOT ZONES
===================================================================== */
.bz{position:absolute;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:5px;z-index:14}
.bzav{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:1.05rem;
  border:2px solid rgba(201,168,76,.25);background:rgba(0,0,0,.52);
  flex-shrink:0;transition:all var(--tm)}
.bzav.on{border-color:var(--gold);box-shadow:0 0 14px rgba(201,168,76,.42)}
.bzinfo{text-align:center}
.bzname{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(212,195,145,.7);font-weight:700}
.bzcnt{font-size:.56rem;color:rgba(165,155,118,.48)}
.bzh{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:175px}
.btbk{width:14px;height:26px;background:linear-gradient(155deg,#2a5238,#152e1e);
  border:1px solid rgba(201,168,76,.3);border-radius:3px;
  box-shadow:1px 2px 5px rgba(0,0,0,.5)}
/* Thinking dots */
.tdots{display:inline-flex;gap:3px;margin-left:4px;vertical-align:middle}
.tdots span{display:inline-block;width:4px;height:4px;border-radius:50%;
  background:var(--gold);animation:td 1.2s ease infinite}
.tdots span:nth-child(2){animation-delay:.2s}
.tdots span:nth-child(3){animation-delay:.4s}
@keyframes td{0%,80%,100%{opacity:.2;transform:scale(.65)}40%{opacity:1;transform:scale(1)}}

/* Bot zone positions */
#bz0{top:8px;left:50%;transform:translateX(-50%)}
#bz1{left:8px;top:50%;transform:translateY(-50%)}
#bz2{right:8px;top:50%;transform:translateY(-50%)}
#bz3{top:8px;left:25%;transform:translateX(-50%)}

/* =====================================================================
   BOARD
===================================================================== */
#bwrap{position:absolute;top:72px;left:0;right:0;bottom:148px;
  overflow:auto;cursor:grab;
  scrollbar-width:thin;scrollbar-color:rgba(201,168,76,.18) transparent}
#bwrap:active{cursor:grabbing}
#bwrap::-webkit-scrollbar{width:4px;height:4px}
#bwrap::-webkit-scrollbar-thumb{background:rgba(201,168,76,.2);border-radius:2px}
#board{position:relative;min-width:4200px;min-height:2100px}

/* =====================================================================
   BONEYARD
===================================================================== */
#byw{position:absolute;right:14px;top:76px;display:flex;
  flex-direction:column;align-items:center;gap:5px;z-index:18}
#byp{position:relative;width:44px;height:82px;cursor:pointer;
  flex-shrink:0;transition:transform var(--ta)}
#byp:hover{transform:scale(1.07) translateY(-2px)}
#byp:active{transform:scale(.96)}
.bycard{position:absolute;width:44px;height:82px;
  background:linear-gradient(145deg,#2c5640,#162e20);
  border:2px solid rgba(201,168,76,.36);border-radius:8px;
  box-shadow:2px 3px 10px rgba(0,0,0,.52);
  background-image:radial-gradient(circle at 50% 50%,rgba(201,168,76,.05) 0%,transparent 58%),
    repeating-linear-gradient(45deg,rgba(201,168,76,.035) 0,rgba(201,168,76,.035) 2px,transparent 2px,transparent 9px)}
#by-count{font-size:.72rem;color:var(--txt-gold);font-weight:700;
  background:rgba(0,0,0,.52);border-radius:10px;padding:2px 8px;
  border:1px solid rgba(201,168,76,.18)}
#by-label{font-size:.54rem;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(172,152,100,.42)}

/* =====================================================================
   STATUS BAR
===================================================================== */
#statwrap{position:fixed;bottom:148px;left:50%;transform:translateX(-50%);
  z-index:40;max-width:94vw;pointer-events:none}
#stat{background:rgba(4,12,6,.84);border:1px solid rgba(201,168,76,.2);
  border-radius:22px;padding:6px 18px;font-size:.78rem;color:var(--txt-gold);
  white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 4px 18px rgba(0,0,0,.38);
  display:flex;align-items:center;gap:8px}
#stat-ic{font-size:.88rem;flex-shrink:0}
.st-flash{animation:stflash .45s ease}
@keyframes stflash{0%{background:rgba(201,168,76,.22)}100%{background:rgba(4,12,6,.84)}}

/* =====================================================================
   PLAYER HAND
===================================================================== */
#phw{position:fixed;bottom:0;left:0;right:0;height:144px;
  background:linear-gradient(to top,rgba(4,10,5,.94) 0%,rgba(4,10,5,.72) 62%,transparent 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding-bottom:12px;z-index:30;pointer-events:none}
#ph-label{font-size:.58rem;letter-spacing:.28em;text-transform:uppercase;
  color:rgba(170,168,142,.5);margin-bottom:8px;pointer-events:none}
#ph{display:flex;gap:8px;overflow-x:auto;padding:0 14px 3px;
  scrollbar-width:thin;scrollbar-color:rgba(201,168,76,.22) transparent;
  max-width:100%;pointer-events:all;-webkit-overflow-scrolling:touch}
#ph::-webkit-scrollbar{height:3px}
#ph::-webkit-scrollbar-thumb{background:rgba(201,168,76,.22);border-radius:2px}

/* =====================================================================
   SIDE CHOICE BAR
===================================================================== */
#sbar{position:fixed;bottom:160px;left:50%;transform:translateX(-50%);
  background:rgba(3,11,5,.96);border:1.5px solid var(--gold);border-radius:16px;
  padding:10px 18px;z-index:66;display:flex;gap:10px;align-items:center;
  font-size:.78rem;color:var(--txt-gold);white-space:nowrap;
  box-shadow:0 12px 42px rgba(0,0,0,.72),0 0 28px rgba(201,168,76,.14);
  animation:sbin .24s cubic-bezier(.34,1.56,.64,1) both}
@keyframes sbin{from{opacity:0;transform:translateX(-50%) scale(.86)}
  to{opacity:1;transform:translateX(-50%) scale(1)}}
#sbar.off{display:none}
.sbtn{border:1.5px solid;border-radius:9px;color:#fff;padding:6px 14px;
  cursor:pointer;font-family:var(--U);font-size:.77rem;font-weight:600;
  transition:all var(--ta);display:flex;align-items:center;gap:5px}
.sbtn:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.5)}
.sbtn:active{transform:translateY(0) scale(.97)}
.sbL{background:rgba(28,108,60,.82);border-color:#4db87a}
.sbR{background:rgba(28,62,118,.82);border-color:#5b9ee8}
.sbX{background:rgba(100,28,28,.82);border-color:#d05858}
.sblabel{font-size:.7rem;letter-spacing:.07em;color:rgba(201,168,76,.65)}

/* =====================================================================
   DOMINO TILE
===================================================================== */
.tile{display:inline-flex;flex-direction:column;align-items:center;
  justify-content:space-between;
  background:linear-gradient(148deg,#fdf8ee,#f0e8d5);
  border:2px solid var(--tile-bd);border-radius:var(--r);
  box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.88);
  cursor:default;transition:transform var(--ta),box-shadow var(--ta),border-color var(--ta);
  flex-shrink:0;overflow:hidden;position:relative}
.tile::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(148deg,rgba(255,255,255,.48) 0%,transparent 52%);
  border-radius:calc(var(--r) - 2px)}

/* Hand sizes */
.tile.V{width:46px;height:88px;padding:6px 0}
.tile.H{width:88px;height:46px;flex-direction:row;padding:0 6px}
/* Board sizes */
.tile.BV{width:38px;height:72px;padding:4px 0;border-width:1.5px}
.tile.BH{width:72px;height:38px;flex-direction:row;padding:0 4px;border-width:1.5px}

.th{display:flex;align-items:center;justify-content:center;flex:1;width:100%}
.tile.H .th,.tile.BH .th{width:auto;height:100%}
/* Dividers */
.tile.V  .tdv,.tile.BV .tdv{width:80%;height:1.5px;margin:0 auto;background:var(--tile-ln);flex-shrink:0}
.tile.H  .tdv,.tile.BH .tdv{height:80%;width:1.5px;margin:auto 0;background:var(--tile-ln);flex-shrink:0}
/* Dot grid */
.dg{display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;
  width:100%;height:100%;padding:3px}
.dr{display:flex;justify-content:space-evenly;width:100%}
.d{width:7px;height:7px;
  background:radial-gradient(circle at 35% 30%,#3d3022,#0e0c07);
  border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.42),inset 0 1px 1px rgba(255,255,255,.08)}
.ds{width:7px;height:7px}
.tile.BV .d,.tile.BH .d{width:5px;height:5px}
.tile.BV .ds,.tile.BH .ds{width:5px;height:5px}

/* PLAYABLE */
.tile.play{border-color:var(--hl);cursor:pointer;
  box-shadow:0 0 0 2.5px var(--hl-g),var(--sh),inset 0 1px 0 rgba(255,255,255,.88);
  animation:tplay 2s ease infinite}
@keyframes tplay{
  0%,100%{box-shadow:0 0 0 2.5px var(--hl-g),var(--sh),inset 0 1px 0 rgba(255,255,255,.88)}
  50%{box-shadow:0 0 0 4px rgba(255,232,77,.72),0 6px 20px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.88)}}
.tile.play:hover{transform:translateY(-10px) scale(1.09) rotate(-1deg);
  box-shadow:0 16px 34px rgba(0,0,0,.55),0 0 0 3.5px var(--hl-g),inset 0 1px 0 rgba(255,255,255,.88);
  z-index:8;animation:none}
.tile.play:active{transform:translateY(-4px) scale(1.04)}

/* SELECTED */
.tile.sel{border-color:#5bc0ff;cursor:pointer;
  box-shadow:0 0 0 3px rgba(91,192,255,.44),0 10px 28px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.88);
  transform:translateY(-10px) scale(1.05);animation:none;z-index:7}

/* Board placed tile */
.btile{position:absolute;animation:tplace .32s cubic-bezier(.34,1.56,.64,1) both}
@keyframes tplace{from{opacity:0;transform:scale(.44) rotate(-14deg)}
  to{opacity:1;transform:scale(1) rotate(0)}}

/* =====================================================================
   SCORE POP
===================================================================== */
.spop{position:fixed;font-family:var(--F);font-size:1.55rem;font-weight:700;
  color:var(--gold-l);pointer-events:none;z-index:220;
  text-shadow:0 2px 10px rgba(0,0,0,.6);animation:spopA 1.25s ease forwards}
@keyframes spopA{0%{opacity:1;transform:translateY(0) scale(.75)}
  35%{opacity:1;transform:translateY(-36px) scale(1.08)}
  100%{opacity:0;transform:translateY(-85px) scale(.85)}}

/* =====================================================================
   TOAST
===================================================================== */
#toasts{position:fixed;top:62px;right:14px;z-index:260;
  display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:rgba(4,14,7,.92);border:1px solid rgba(201,168,76,.2);
  border-radius:10px;padding:8px 14px;font-size:.75rem;color:var(--txt);
  max-width:240px;backdrop-filter:blur(8px);box-shadow:var(--sh);
  animation:tin .28s ease both}

<script>
/* ═══════════════════════════════════════════════════════════════════════
   DOMINOES  —  Complete Game Engine
   ───────────────────────────────────────────────────────────────────────
   Rules (Draw Game — standard):
   • 28 tiles: [0|0] to [6|6], 7 suits of 7 = 28 unique dominos
   • 2 players → 7 tiles each;  3-5 players → 5 tiles each
   • Highest double starts; tie-break = highest pip total
   • Each turn: play matching tile OR draw from boneyard until can play
   • Reserve: 2-player → 2 tiles; 3-5 players → 1 tile (can't be drawn)
   • All players pass + boneyard exhausted → BLOCKED GAME
   • Win: empty hand wins round. Blocked: fewest pips wins round.
   • Score: rounded-to-5 sum of opponents' remaining pips
   • Session: first to 100 pts wins overall
   ═══════════════════════════════════════════════════════════════════════ */

/* ─────────────────────────────────────────
   WEB AUDIO ENGINE  (zero external deps)
───────────────────────────────────────── */
let AC = null;
let soundOn = true;

function getAC() {
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  return AC;
}

function tone(freq, type, dur, vol, attack, decay) {
  if (!soundOn) return;
  vol    = vol    || 0.16;
  attack = attack || 0.005;
  decay  = decay  || 0.08;
  try {
    var ctx = getAC(); if (!ctx) return;
    var osc = ctx.createOscillator();
    var g   = ctx.createGain();
    osc.connect(g); g.connect(ctx.destination);
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    var t = ctx.currentTime;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.start(t); osc.stop(t + dur + 0.05);
  } catch(e) {}
}

function noise(dur, vol, bpFreq) {
  if (!soundOn) return;
  vol = vol || 0.07; bpFreq = bpFreq || 1100;
  try {
    var ctx = getAC(); if (!ctx) return;
    var sr  = ctx.sampleRate;
    var buf = ctx.createBuffer(1, sr * dur, sr);
    var d   = buf.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    var src = ctx.createBufferSource();
    var flt = ctx.createBiquadFilter();
    var g   = ctx.createGain();
    flt.type = 'bandpass'; flt.frequency.value = bpFreq; flt.Q.value = 0.7;
    src.buffer = buf;
    src.connect(flt); flt.connect(g); g.connect(ctx.destination);
    var t = ctx.currentTime;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.start(t); src.stop(t + dur + 0.05);
  } catch(e) {}
}

var SFX = {
  place:  function() { noise(.04, .25, 900); tone(160, 'sine', .07, .05); },
  draw:   function() { noise(.065, .12, 1300); tone(300, 'sine', .09, .035); },
  yours:  function() { tone(660,'sine',.11,.12); setTimeout(function(){ tone(880,'sine',.17,.1); }, 105); },
  hover:  function() { tone(540,'sine',.05,.035); },
  click:  function() { tone(420,'sine',.045,.055); },
  win:    function() { [523,659,784,1047].forEach(function(f,i){ setTimeout(function(){ tone(f,'triangle',.26,.14); }, i*92); }); },
  lose:   function() { [390,328,260].forEach(function(f,i){ setTimeout(function(){ tone(f,'sawtooth',.28,.1); }, i*105); }); },
  bad:    function() { tone(210,'sawtooth',.12,.1); },
  pass:   function() { tone(320,'sine',.09,.07); setTimeout(function(){ tone(255,'sine',.14,.05); }, 82); },
  shuffle:function() { for(var i=0;i<9;i++)(function(j){ setTimeout(function(){ noise(.038,.09,800+j*100); }, j*52); })(i); }
};

function toggleSound() {
  soundOn = !soundOn;
  SFX.click();
  var label = soundOn ? '🔊 Sound On' : '🔇 Sound Off';
  var hb = document.getElementById('hbtn-snd');
  var ms = document.getElementById('ms-snd');
  if (hb) hb.textContent = soundOn ? '🔊' : '🔇';
  if (ms) ms.textContent = label;
  toast(soundOn ? '🔊 Sound enabled' : '🔇 Sound muted');
}

/* ─────────────────────────────────────────
   PARTICLE BACKGROUND
───────────────────────────────────────── */
(function() {
  var cv  = document.getElementById('pcv');
  var ctx = cv.getContext('2d');
  var W, H, pts;
  function resize() { W = cv.width = window.innerWidth; H = cv.height = window.innerHeight; }
  function mkPt() {
    return { x:Math.random()*W, y:Math.random()*H,
      r:Math.random()*1.7+.4, vx:(Math.random()-.5)*.2, vy:(Math.random()-.5)*.2,
      a:Math.random(), va:(Math.random()-.5)*.005,
      gold:Math.random()>.6 };
  }
  function init() { resize(); pts = []; for(var i=0;i<52;i++) pts.push(mkPt()); }
  function frame() {
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<pts.length;i++) {
      var p = pts[i];
      p.x+=p.vx; p.y+=p.vy; p.a+=p.va;
      if(p.a<0){p.va=Math.abs(p.va);} if(p.a>1){p.va=-Math.abs(p.va);}
      if(p.x<-5)p.x=W+5; if(p.x>W+5)p.x=-5;
      if(p.y<-5)p.y=H+5; if(p.y>H+5)p.y=-5;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle = p.gold ? 'rgba(201,168,76,'+Math.max(0,p.a*.55)+')' : 'rgba(240,230,200,'+Math.max(0,p.a*.38)+')';
      ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize', resize);
  init(); frame();
})();

/* ─────────────────────────────────────────
   DOT PATTERNS
───────────────────────────────────────── */
var DOTPAT = {
  0: [],
  1: [[0,1,0]],
  2: [[0,1,0],[0,0,0],[0,1,0]],
  3: [[0,1,0],[0,1,0],[0,1,0]],
  4: [[1,0,1],[0,0,0],[1,0,1]],
  5: [[1,0,1],[0,1,0],[1,0,1]],
  6: [[1,0,1],[1,0,1],[1,0,1]]
};

/* ─────────────────────────────────────────
   BUILD DOMINO TILE ELEMENT
───────────────────────────────────────── */
var hoverTmr = null;
function mkTile(a, b, opts) {
  opts = opts || {};
  /* opts: { horiz, board, playable, selected, onclick } */
  var isH = opts.horiz, brd = opts.board;
  var szV = brd ? 'BV' : 'V', szH = brd ? 'BH' : 'H';

  var el = document.createElement('div');
  el.className = 'tile ' + (isH ? szH : szV);
  if (opts.playable) el.classList.add('play');
  if (opts.selected) el.classList.add('sel');
  if (opts.onclick)  el.addEventListener('click', opts.onclick);
  if (opts.playable) {
    el.addEventListener('mouseenter', function() {
      clearTimeout(hoverTmr);
      hoverTmr = setTimeout(function(){ SFX.hover(); }, 85);
    });
  }

  var ha = document.createElement('div'); ha.className = 'th';
  ha.appendChild(buildDots(a, brd));
  var dv = document.createElement('div'); dv.className = 'tdv';
  var hb = document.createElement('div'); hb.className = 'th';
  hb.appendChild(buildDots(b, brd));

  el.appendChild(ha); el.appendChild(dv); el.appendChild(hb);
  return el;
}

function buildDots(n, brd) {
  var dg = document.createElement('div'); dg.className = 'dg';
  var rows = DOTPAT[n] || [];
  if (!rows.length) return dg;
  for (var i = 0; i < rows.length; i++) {
    var row = rows[i];
    var r   = document.createElement('div'); r.className = 'dr';
    for (var j = 0; j < row.length; j++) {
      var c  = document.createElement('div');
      c.className = row[j] ? 'd' : 'ds';
      r.appendChild(c);
    }
    dg.appendChild(r);
  }
  return dg;
}

/* ─────────────────────────────────────────
   GENERATE & SHUFFLE
───────────────────────────────────────── */
function genSet() {
  var t = [];
  for (var a = 0; a <= 6; a++)
    for (var b = a; b <= 6; b++)
      t.push({ a:a, b:b });
  return t;
}
function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}
function pip(t)   { return t.a + t.b; }
function hpip(p)  { return p.hand.reduce(function(s,t){ return s+pip(t); }, 0); }

/* ─────────────────────────────────────────
   BOT DATA
───────────────────────────────────────── */
var BOTS = [
  { name:'Ace', emoji:'🤖', color:'#4da6e8' },
  { name:'Rex', emoji:'🦊', color:'#e8844d' },
  { name:'Max', emoji:'🦁', color:'#c9a84c' },
  { name:'Zoe', emoji:'🐺', color:'#a04de8' }
];
var BZ_IDS = ['bz0','bz1','bz2','bz3'];

/* ─────────────────────────────────────────
   GAME STATE
───────────────────────────────────────── */
var G   = {};
var TMR = null;
var SEL = -1;   // selected hand-tile index

/* ─────────────────────────────────────────
   INIT GAME
───────────────────────────────────────── */
function initGame(numBots) {
  var tiles = shuffle(genSet());
  var total = 1 + numBots;
  var hs    = total <= 2 ? 7 : 5;

  var players = [];
  for (var i = 0; i < total; i++) {
    players.push({
      id:    i,
      name:  i === 0 ? 'You' : BOTS[i-1].name,
      emoji: i === 0 ? '🧑' : BOTS[i-1].emoji,
      color: i === 0 ? '#4ddd88' : BOTS[i-1].color,
      bot:   i !== 0,
      hand:  tiles.splice(0, hs),
      score: 0
    });
  }

  /* Find who starts: highest double; fallback: highest tile */
  var first = -1, hd = -1;
  for (var pi = 0; pi < players.length; pi++) {
    for (var ti = 0; ti < players[pi].hand.length; ti++) {
      var t = players[pi].hand[ti];
      if (t.a === t.b && t.a > hd) { hd = t.a; first = pi; }
    }
  }
  if (first === -1) {
    var maxP = -1;
    for (var pi2 = 0; pi2 < players.length; pi2++) {
      for (var ti2 = 0; ti2 < players[pi2].hand.length; ti2++) {
        if (pip(players[pi2].hand[ti2]) > maxP) { maxP = pip(players[pi2].hand[ti2]); first = pi2; }
      }
    }
  }
  if (first === -1) first = 0;

  /* Board virtual canvas: very large so chain can extend freely */
  var BCX = 2100, BCY = 1050;
  /* Tile dimensions on board */
  var NW = 72, NH = 38; /* normal horizontal tile: width=72, height=38 */
  var DW = 38, DH = 72; /* double (vertical) tile: width=38, height=72 */

  G = {
    players:  players,
    boneyard: tiles,
    chain:    [],       /* board tile records */
    openL:    null,     /* pip value at left open end */
    openR:    null,     /* pip value at right open end */
    /* Left-end cursor (top-left of next slot going left) */
    curLX: BCX,
    curLY: BCY - NH/2,
    /* Right-end cursor (top-left of next slot going right) */
    curRX: BCX,
    curRY: BCY - NH/2,
    BCX: BCX, BCY: BCY,
    NW: NW, NH: NH, DW: DW, DH: DH,
    numBots:  numBots,
    cur:      first,    /* current player index */
    over:     false,
    isFirst:  true,     /* first tile not placed yet */
    passStreak: 0       /* consecutive passes */
  };
  SEL = -1;
}

/* ─────────────────────────────────────────
   VALID MOVES
───────────────────────────────────────── */
function validMoves(hand, oL, oR, isFirst) {
  if (isFirst) {
    var all = [];
    for (var i = 0; i < hand.length; i++) all.push(i);
    return all;
  }
  var out = [];
  for (var i = 0; i < hand.length; i++) {
    var t = hand[i];
    if (t.a === oL || t.b === oL || t.a === oR || t.b === oR) out.push(i);
  }
  return out;
}

/* ─────────────────────────────────────────
   PLACE TILE ON BOARD
   Chain grows left and right from center.
   Doubles rendered perpendicular (vertical in horizontal chain).
───────────────────────────────────────── */
function placeChain(player, tIdx, side) {
  var t  = player.hand[tIdx];
  var rA = t.a, rB = t.b;
  var NW = G.NW, NH = G.NH, DW = G.DW, DH = G.DH;

  if (G.isFirst) {
    /* First tile centered on board */
    var dbl = (t.a === t.b);
    var tw  = dbl ? DW : NW;
    var th  = dbl ? DH : NH;
    var x   = G.BCX - tw / 2;
    var y   = G.BCY - th / 2;
    G.chain.push({ a:rA, b:rB, x:x, y:y, dbl:dbl });
    G.openL = rA;
    G.openR = rB;
    /* After first tile, left cursor is at left edge of tile, right cursor at right edge */
    G.curLX = x;
    G.curLY = G.BCY - NH / 2;
    G.curRX = x + tw;
    G.curRY = G.BCY - NH / 2;
    G.isFirst = false;
  }
  else if (side === 'L') {
    /*
      Tile attaches on left end.
      The RIGHT end of the new tile must match openL.
      So we orient: rB = openL (connecting end), rA = new openL.
    */
    if (t.a === G.openL) { rA = t.b; rB = t.a; }
    else                  { rA = t.a; rB = t.b; }
    var dbl2 = (rA === rB);
    var tw2  = dbl2 ? DW : NW;
    var nx   = G.curLX - tw2;
    var ny   = G.curLY;
    G.chain.push({ a:rA, b:rB, x:nx, y:ny, dbl:dbl2 });
    G.curLX  = nx;
    G.openL  = rA;
  }
  else { /* 'R' */
    /*
      Tile attaches on right end.
      The LEFT end of the new tile must match openR.
      So we orient: rA = openR (connecting end), rB = new openR.
    */
    if (t.a === G.openR) { rA = t.a; rB = t.b; }
    else                  { rA = t.b; rB = t.a; }
    var dbl3 = (rA === rB);
    var tw3  = dbl3 ? DW : NW;
    var nx3  = G.curRX;
    var ny3  = G.curRY;
    G.chain.push({ a:rA, b:rB, x:nx3, y:ny3, dbl:dbl3 });
    G.curRX  = nx3 + tw3;
    G.openR  = rB;
  }

  player.hand.splice(tIdx, 1);
  G.passStreak = 0;
  SEL = -1;

  SFX.place();
  renderBoard();
  renderHUD();

  /* Score popup when open ends sum to multiple of 5 */
  if (!G.isFirst && G.openL !== null && G.openR !== null) {
    var esum = G.openL + G.openR;
    if (esum > 0 && esum % 5 === 0) scorePop(esum);
  }
}

/* ─────────────────────────────────────────
   BOT AI
───────────────────────────────────────── */
function botMove(player) {
  var valid = validMoves(player.hand, G.openL, G.openR, G.isFirst);
  if (!valid.length) return false;

  var best = null, bestScore = -Infinity;

  for (var vi = 0; vi < valid.length; vi++) {
    var idx = valid[vi];
    var t   = player.hand[idx];
    var dbl = (t.a === t.b);

    var sides = [];
    if (G.isFirst) {
      sides.push('R');
    } else {
      if (t.a === G.openL || t.b === G.openL) sides.push('L');
      if (t.a === G.openR || t.b === G.openR) sides.push('R');
    }

    for (var si = 0; si < sides.length; si++) {
      var s = sides[si];
      /* Heuristic: shed heavy tiles; prefer doubles to restrict opponent;
         avoid opening 6 or 0 ends (too useful for others) */
      var sc = pip(t) * 9;
      if (dbl) sc += 6;           /* doubles are strategically strong */
      /* Determine what the new open end would be */
      var newOpen;
      if (G.isFirst) {
        newOpen = t.b;
      } else if (s === 'L') {
        newOpen = (t.a === G.openL) ? t.b : t.a;
      } else {
        newOpen = (t.a === G.openR) ? t.b : t.a;
      }
      if (newOpen === 6 || newOpen === 0) sc -= 5; /* risky opening */
      if (sc > bestScore) { bestScore = sc; best = { idx:idx, side:s }; }
    }
  }

  if (best) { placeChain(player, best.idx, best.side); return true; }
  return false;
}

/* ─────────────────────────────────────────
   BONEYARD
───────────────────────────────────────── */
function getReserve() { return G.players.length <= 2 ? 2 : 1; }
function byardOk()    { return G.boneyard.length > getReserve(); }

function drawTile(player) {
  if (!byardOk()) return null;
  var t = G.boneyard.shift();
  player.hand.push(t);
  SFX.draw();
  renderBoneyard();
  return t;
}

/* ─────────────────────────────────────────
   BLOCKED CHECK
───────────────────────────────────────── */
function isBlocked() {
  if (byardOk()) return false;
  for (var i = 0; i < G.players.length; i++) {
    if (validMoves(G.players[i].hand, G.openL, G.openR, G.isFirst).length > 0) return false;
  }
  return true;
}

/* ─────────────────────────────────────────
   SCORING & END
───────────────────────────────────────── */
function rnd5(n) { return Math.round(n / 5) * 5; }

function endHand(winIdx, blocked) {
  G.over = true;
  var w = G.players[winIdx];
  var bonus;
  if (blocked) {
    var mine = hpip(w);
    var all  = G.players.reduce(function(s,p){ return s + hpip(p); }, 0);
    bonus = rnd5(all - mine);
  } else {
    var opp = 0;
    for (var i = 0; i < G.players.length; i++) {
      if (i !== winIdx) opp += hpip(G.players[i]);
    }
    bonus = rnd5(opp);
  }
  w.score += bonus;
  renderHUD();
  if (winIdx === 0) SFX.win(); else SFX.lose();
  setTimeout(function(){ showGO(winIdx, bonus, blocked); }, 350);
}

/* ─────────────────────────────────────────
   TURN ENGINE
───────────────────────────────────────── */
function nextPlayer() {
  G.cur = (G.cur + 1) % G.players.length;
  runTurn();
}

function runTurn() {
  if (G.over) return;
  var p = G.players[G.cur];
  renderHUD();
  renderTurnBadge(p);
  if (p.hand.length === 0) { endHand(p.id, false); return; }

  if (p.bot) {
    setSt('⏳', p.name + ' is thinking…');
    setBotThinking(p.id, true);
    TMR = setTimeout(function(){ doBotTurn(p); }, 880 + Math.random()*380);
  } else {
    setBotThinking(-1, false);
    SFX.yours();
    doHumanTurn(p);
  }
}

function doBotTurn(p) {
  setBotThinking(p.id, false);
  var moved = botMove(p);

  if (!moved) {
    var draws = 0;
    while (!moved && draws < 28) {
      if (!byardOk()) break;
      drawTile(p);
      renderBotHands();
      moved = botMove(p);
      draws++;
    }
    if (!moved) {
      G.passStreak = (G.passStreak || 0) + 1;
      setSt('⏭️', p.name + ' has no moves — passing.');
      SFX.pass();
      if (G.passStreak >= G.players.length || isBlocked()) {
        setTimeout(blockEnd, 700); return;
      }
    } else {
      G.passStreak = 0;
    }
  }

  renderBotHands();
  if (p.hand.length === 0) { endHand(p.id, false); return; }
  if (isBlocked())         { blockEnd(); return; }
  setTimeout(nextPlayer, 520);
}

function doHumanTurn(p) {
  var valid = validMoves(p.hand, G.openL, G.openR, G.isFirst);
  if (valid.length > 0) {
    setSt('🟡', 'Your turn — tap a glowing tile to play.');
    renderHand(valid);
  } else if (byardOk()) {
    setSt('🃏', 'No valid moves — tap the Boneyard to draw a tile.');
    renderHand([]);
  } else {
    G.passStreak = (G.passStreak || 0) + 1;
    setSt('⏭️', 'No moves, boneyard empty — turn passed.');
    SFX.pass();
    renderHand([]);
    if (G.passStreak >= G.players.length || isBlocked()) {
      setTimeout(blockEnd, 800);
    } else {
      setTimeout(nextPlayer, 1100);
    }
  }
}

function blockEnd() {
  var minPip = Infinity, minIdx = 0;
  for (var i = 0; i < G.players.length; i++) {
    var v = hpip(G.players[i]);
    if (v < minPip) { minPip = v; minIdx = i; }
  }
  endHand(minIdx, true);
}

/* ─────────────────────────────────────────
   HUMAN ACTIONS
───────────────────────────────────────── */
function tileClick(idx) {
  if (G.cur !== 0 || G.over) return;
  var p     = G.players[0];
  var valid = validMoves(p.hand, G.openL, G.openR, G.isFirst);
  if (valid.indexOf(idx) === -1) { SFX.bad(); return; }
  SFX.click();

  var t = p.hand[idx];

  if (G.isFirst) {
    placeChain(p, idx, 'R');
    afterHuman(p); return;
  }

  var canL = (t.a === G.openL || t.b === G.openL);
  var canR = (t.a === G.openR || t.b === G.openR);

  /* If both ends match AND open values differ → ask player */
  if (canL && canR && G.openL !== G.openR) {
    SEL = idx;
    renderHand(valid);
    document.getElementById('sbL').textContent = '◀ Left (' + G.openL + ')';
    document.getElementById('sbR').textContent = 'Right (' + G.openR + ') ▶';
    document.getElementById('sbar').classList.remove('off');
    setSt('🔀', 'Choose which end of the chain to play on:');
  } else {
    SEL = -1;
    placeChain(p, idx, canL ? 'L' : 'R');
    afterHuman(p);
  }
}

function doSide(side) {
  if (SEL === -1) return;
  SFX.click();
  var p = G.players[0];
  hideSB();
  placeChain(p, SEL, side);
  SEL = -1;
  afterHuman(p);
}

function cancelSide() { SFX.click(); SEL = -1; hideSB(); }
function hideSB() { document.getElementById('sbar').classList.add('off'); }

function afterHuman(p) {
  hideSB(); SEL = -1;
  if (p.hand.length === 0) { endHand(0, false); return; }
  if (isBlocked())         { blockEnd(); return; }
  setTimeout(nextPlayer, 360);
}

function playerDraw() {
  if (G.cur !== 0 || G.over) return;
  var p     = G.players[0];
  var valid = validMoves(p.hand, G.openL, G.openR, G.isFirst);

  if (valid.length > 0) {
    SFX.bad();
    setSt('⚠️', 'You have playable tiles — tap a glowing one!');
    /* Jiggle playable tiles */
    var tiles = document.querySelectorAll('.tile.play');
    for (var i = 0; i < tiles.length; i++) {
      (function(el){ el.style.transform='translateY(-13px) scale(1.1)';
        setTimeout(function(){ el.style.transform=''; }, 300); })(tiles[i]);
    }
    return;
  }

  if (!byardOk()) {
    G.passStreak = (G.passStreak || 0) + 1;
    setSt('⏭️', 'Boneyard empty — passing your turn.');
    SFX.pass();
    setTimeout(function() {
      if (isBlocked() || G.passStreak >= G.players.length) { blockEnd(); return; }
      nextPlayer();
    }, 900);
    return;
  }

  var drawn = drawTile(p);
  if (drawn) {
    toast('Drew: ' + drawn.a + '-' + drawn.b);
    var v2 = validMoves(p.hand, G.openL, G.openR, G.isFirst);
    renderHand(v2);
    setSt(v2.length ? '✅' : '🃏', v2.length ? 'Tile drawn! Tap it to play.' : "Drawn — no match yet. Draw again or pass.");
  }
}

/* ─────────────────────────────────────────
   RENDER: BOARD
───────────────────────────────────────── */
function renderBoard() {
  var board = document.getElementById('board');
  board.innerHTML = '';
  var NW = G.NW, NH = G.NH, DW = G.DW, DH = G.DH;

  var minX = Infinity, maxX = -Infinity,
      minY = Infinity, maxY = -Infinity;

  for (var i = 0; i < G.chain.length; i++) {
    var rec = G.chain[i];
    var dbl = rec.dbl;

    /* Doubles are rendered vertically; normals horizontally */
    var el = mkTile(rec.a, rec.b, { horiz: !dbl, board: true });
    el.classList.add('btile');

    if (dbl) {
      /* Vertical double tile — center it vertically on the chain row */
      var oy = (DH - NH) / 2;
      el.style.left = rec.x + 'px';
      el.style.top  = (rec.y - oy) + 'px';
      minX = Math.min(minX, rec.x);      maxX = Math.max(maxX, rec.x + DW);
      minY = Math.min(minY, rec.y - oy); maxY = Math.max(maxY, rec.y - oy + DH);
    } else {
      el.style.left = rec.x + 'px';
      el.style.top  = rec.y + 'px';
      minX = Math.min(minX, rec.x);      maxX = Math.max(maxX, rec.x + NW);
      minY = Math.min(minY, rec.y);      maxY = Math.max(maxY, rec.y + NH);
    }
    board.appendChild(el);
  }

  /* Auto-scroll to keep the chain centered */
  if (G.chain.length > 0) {
    var bw   = document.getElementById('bwrap');
    var midX = (minX + maxX) / 2;
    var midY = (minY + maxY) / 2;
    bw.scrollTo({
      left: midX - bw.clientWidth  / 2,
      top:  midY - bw.clientHeight / 2,
      behavior: G.chain.length <= 1 ? 'auto' : 'smooth'
    });
  }
}

/* ─────────────────────────────────────────
   RENDER: PLAYER HAND
───────────────────────────────────────── */
function renderHand(validSet) {
  validSet = validSet || [];
  var ph = document.getElementById('ph');
  ph.innerHTML = '';
  var p = G.players[0];
  if (!p) return;

  var vs = {};
  for (var i = 0; i < validSet.length; i++) vs[validSet[i]] = true;

  for (var i = 0; i < p.hand.length; i++) {
    (function(t, idx) {
      var play = !!vs[idx];
      var sel  = (SEL === idx);
      var el   = mkTile(t.a, t.b, {
        playable: play,
        selected: sel,
        onclick:  play ? function(){ tileClick(idx); } : null
      });
      el.title = t.a + '-' + t.b + (play ? ' — click to play' : '');
      el.style.animation = 'tplace .3s cubic-bezier(.34,1.56,.64,1) ' + (idx * 38) + 'ms both';
      ph.appendChild(el);
    })(p.hand[i], i);
  }
}

/* ─────────────────────────────────────────
   RENDER: BOT ZONES
───────────────────────────────────────── */
var BOT_ZONE_STYLES = {
  bz0: 'top:8px;left:50%;transform:translateX(-50%)',
  bz1: 'left:8px;top:50%;transform:translateY(-50%)',
  bz2: 'right:8px;top:50%;transform:translateY(-50%)',
  bz3: 'top:8px;left:25%;transform:translateX(-50%)'
};
var BOT_SLOT_MAP = { 1:['bz0'], 2:['bz0','bz2'], 3:['bz0','bz1','bz2'], 4:['bz3','bz0','bz1','bz2'] };

function getBotSlots() {
  return BOT_SLOT_MAP[G.numBots] || ['bz0'];
}

function renderBotZones() {
  for (var zi = 0; zi < BZ_IDS.length; zi++) {
    var z = document.getElementById(BZ_IDS[zi]);
    if (z) z.style.display = 'none';
  }
  var slots = getBotSlots();
  for (var b = 0; b < G.numBots; b++) {
    var p    = G.players[b + 1];
    var zid  = slots[b];
    var zone = document.getElementById(zid);
    if (!zone || !p) continue;
    zone.style.cssText = 'display:flex;' + BOT_ZONE_STYLES[zid];
    zone.innerHTML =
      '<div class="bzav" id="av-'+p.id+'">'+p.emoji+'</div>' +
      '<div class="bzinfo">' +
        '<div class="bzname" id="bn-'+p.id+'">'+p.name+'</div>' +
        '<div class="bzcnt"  id="bc-'+p.id+'">'+p.hand.length+' tiles</div>' +
      '</div>' +
      '<div class="bzh" id="bh-'+p.id+'"></div>';
    fillBotHand(p);
  }
}

function renderBotHands() {
  for (var i = 0; i < G.players.length; i++) {
    var p = G.players[i];
    if (!p.bot) continue;
    var bn = document.getElementById('bn-'+p.id);
    var bc = document.getElementById('bc-'+p.id);
    if (bn) bn.textContent = p.name;
    if (bc) bc.textContent = p.hand.length + ' tiles';
    fillBotHand(p);
  }
}

function fillBotHand(p) {
  var hel = document.getElementById('bh-'+p.id);
  if (!hel) return;
  hel.innerHTML = '';
  for (var i = 0; i < p.hand.length; i++) {
    var b = document.createElement('div');
    b.className = 'btbk';
    hel.appendChild(b);
  }
}

function setBotThinking(pid, show) {
  /* Avatar glow */
  for (var i = 0; i < G.players.length; i++) {
    var av = document.getElementById('av-'+G.players[i].id);
    if (av) {
      if (show && G.players[i].id === pid) av.classList.add('on');
      else av.classList.remove('on');
    }
  }
  /* Thinking dots on name label */
  for (var i = 0; i < G.players.length; i++) {
    var bn = document.getElementById('bn-'+G.players[i].id);
    if (!bn) continue;
    var td = bn.querySelector('.tdots');
    if (show && G.players[i].id === pid) {
      if (!td) {
        var dots = document.createElement('span');
        dots.className = 'tdots';
        dots.innerHTML = '<span></span><span></span><span></span>';
        bn.appendChild(dots);
      }
    } else {
      if (td) td.remove();
    }
  }
}

/* ─────────────────────────────────────────
   RENDER: BONEYARD
───────────────────────────────────────── */
function renderBoneyard() {
  var cnt  = document.getElementById('by-count');
  var pile = document.getElementById('byp');
  if (!cnt || !pile) return;
  cnt.textContent     = G.boneyard ? G.boneyard.length : '';
  var ok              = byardOk();
  pile.style.opacity  = ok ? '1' : '0.22';
  pile.style.pointerEvents = ok ? 'auto' : 'none';
  pile.title = ok ? 'Click to draw a tile (' + G.boneyard.length + ' left)' : 'Boneyard exhausted';
}

/* ─────────────────────────────────────────
   RENDER: HUD SCORE CHIPS
───────────────────────────────────────── */
function renderHUD() {
  var el = document.getElementById('hscores');
  el.innerHTML = '';
  for (var i = 0; i < G.players.length; i++) {
    var p = G.players[i];
    var c = document.createElement('div');
    c.className = 'chip' + (p.id === G.cur ? ' act' : '');
    c.innerHTML =
      '<span style="margin-right:2px">'+p.emoji+'</span>' +
      '<span class="cn">'+p.name+'</span>' +
      '<span class="cs">'+p.score+'pts</span>' +
      '<span class="ct">['+p.hand.length+']</span>';
    el.appendChild(c);
  }
}

/* ─────────────────────────────────────────
   RENDER: TURN BADGE
───────────────────────────────────────── */
function renderTurnBadge(p) {
  var tb  = document.getElementById('tbadge');
  var txt = document.getElementById('tbadge-txt');
  if (!p) { tb.classList.add('off'); return; }
  tb.classList.remove('off');

  tb.className = 'tbadge ' + (you ? 'yours' : 'theirs'); /* keep id via JS */
  tb.id = 'tbadge';

}

/* ─────────────────────────────────────────
   STATUS BAR
───────────────────────────────────────── */
function setSt(icon, msg) {
  var ic = document.getElementById('stat-ic');
  var tx = document.getElementById('stat-txt');
  if (ic) ic.textContent = icon || '⏳';
  if (tx) tx.textContent = msg  || '';

/* ─────────────────────────────────────────
   TOAST
───────────────────────────────────────── */
function toast(msg) {
  var wrap = document.getElementById('toasts');
  var el   = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(function() {
    el.classList.add('out');
    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 320);
  }, 2600);
}

/* ─────────────────────────────────────────
   SCORE POPUP
───────────────────────────────────────── */
function scorePop(n) {
  var el = document.createElement('div');
  el.className   = 'spop';
  el.textContent = '+' + n + '!';
  el.style.left  = (30 + Math.random() * 38) + '%';
  el.style.top   = '42%';
  document.body.appendChild(el);
  setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 1300);
}

/* ─────────────────────────────────────────
   CONFETTI (inside game-over card)
───────────────────────────────────────── */
function launchConfetti() {
  var cv  = document.getElementById('cnfc');
  var ctx = cv.getContext('2d');
  cv.width  = cv.offsetWidth  || 400;
  cv.height = cv.offsetHeight || 360;
  var W = cv.width, H = cv.height;
  var pieces = [];
  for (var i = 0; i < 85; i++) {
    pieces.push({
      x: Math.random()*W, y: -8 - Math.random()*75,
      w: 6+Math.random()*8, h: 3+Math.random()*4,
      rot: Math.random()*360,
      vx: (Math.random()-.5)*3.2, vy: 1.8+Math.random()*3.2,
      vr: (Math.random()-.5)*7,
      col: 'hsl('+Math.floor(Math.random()*360)+',78%,64%)',
      a: 1
    });
  }
  var fr = 0;
  function draw() {
    ctx.clearRect(0,0,W,H);
    var alive = false;
    for (var i = 0; i < pieces.length; i++) {
      var p = pieces[i];
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      if (p.y > H) p.a -= 0.05;
      if (p.a > 0) alive = true;
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.a);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.col;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    }
    if (alive && fr++ < 190) requestAnimationFrame(draw);
    else ctx.clearRect(0,0,W,H);
  }
  draw();
}

/* ─────────────────────────────────────────
   GAME OVER SCREEN
───────────────────────────────────────── */
function showGO(winIdx, bonus, blocked) {
  var w      = G.players[winIdx];
  var youWin = (w.id === 0);
  var gov    = document.getElementById('gov');

  document.getElementById('go- trophy').textContent = youWin ? '🏆' : w.emoji;
  document.getElementById('go-title').textContent  = youWin ? 'You Win!' : w.name + ' Wins!';
  document.getElementById('go-msg').textContent    =
    (blocked ? 'Game blocked — fewest remaining pips wins! '
             : (youWin ? 'You played all your tiles! ' : w.name + ' played all tiles. '))
    + 'Bonus: +' + bonus + ' points.';

  var sc = document.getElementById('go-sc');
  sc.innerHTML = '<div class="grow" style="font-size:.63rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(201,168,76,.52);padding-bottom:5px"><span>Player</span><span>Score &amp; Pips</span></div>';

  var sorted = G.players.slice().sort(function(a,b){ return b.score - a.score; });
  for (var i = 0; i < sorted.length; i++) {
    var p = sorted[i];
    var r = document.createElement('div');
    r.className = 'grow' + (p.id === winIdx ? ' w' : '');
    r.innerHTML =
      '<div class="grow-l"><span>'+p.emoji+'</span><span>'+p.name+'</span>'+(p.id===winIdx?'<span style="font-size:.7rem">🥇</span>':'')+'</div>'+
      '<span>'+p.score+' pts <span class="grow-pips">('+hpip(p)+' pips)</span></span>';
    sc.appendChild(r);
  }

  gov.classList.remove('off');
  if (youWin) setTimeout(launchConfetti, 220);
}

/* ─────────────────────────────────────────
   DECORATIVE TILES (menu)
───────────────────────────────────────── */
function renderDeco() {
  var el = document.getElementById('deco');
  if (!el) return;
  el.innerHTML = '';
  var pairs = [[6,6],[4,3],[1,5],[3,3],[5,5],[2,0],[6,1]];
  for (var i = 0; i < pairs.length; i++) {
    (function(a, b, idx) {
      var t = mkTile(a, b, {});
      t.style.cssText = 'width:26px;height:50px;border-width:1.5px;cursor:default;flex-shrink:0;opacity:0;' +
        'transition:opacity .4s ease '+idx*80+'ms, transform .4s ease '+idx*80+'ms;transform:translateY(10px)';
      t.querySelectorAll('.d,.ds').forEach(function(d){ d.style.width='4px'; d.style.height='4px'; });
      el.appendChild(t);
      requestAnimationFrame(function(){ requestAnimationFrame(function(){
        t.style.opacity = '1'; t.style.transform = 'translateY(0)';
      }); });
    })(pairs[i][0], pairs[i][1], i);
  }
}

/* ─────────────────────────────────────────
   DRAG-TO-SCROLL BOARD
───────────────────────────────────────── */
(function() {
  var down = false, sx, sy, sl, st;
  document.addEventListener('mousedown', function(e) {
    var bw = document.getElementById('bwrap');
    if (!bw || !bw.contains(e.target)) return;
    if (e.target.closest && e.target.closest('.tile')) return;
    down = true;
    sx = e.pageX - bw.getBoundingClientRect().left + bw.scrollLeft;
    sy = e.pageY - bw.getBoundingClientRect().top  + bw.scrollTop;
    sl = bw.scrollLeft; st = bw.scrollTop;
    e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!down) return;
    var bw = document.getElementById('bwrap'); if (!bw) return;
    bw.scrollLeft = sl - (e.pageX - bw.getBoundingClientRect().left + bw.scrollLeft - sx) + sl - bw.scrollLeft;
    /* simpler approach: */
    bw.scrollLeft = sx - (e.pageX - bw.getBoundingClientRect().left);
    bw.scrollTop  = sy - (e.pageY - bw.getBoundingClientRect().top);
  });
  document.addEventListener('mouseup',   function() { down = false; });
  document.addEventListener('mouseleave',function() { down = false; });
})();

function goMenu() {
  SFX.click();
  if (TMR) { clearTimeout(TMR); TMR = null; }
  hideSB(); SEL = -1;
  G = {};
  var tb = document.getElementById('tbadge');
  if (tb) tb.classList.add('off');
  document.getElementById('MS').classList.remove('off');
  document.getElementById('GS').classList.add('off');
  document.getElementById('gov').classList.add('off');
}

function startGame(numBots) {
  SFX.click();
  SFX.shuffle();
  if (TMR) { clearTimeout(TMR); TMR = null; }
  hideSB(); SEL = -1;

  document.getElementById('MS').classList.add('off');
  document.getElementById('GS').classList.remove('off');
  document.getElementById('gov').classList.add('off');

  initGame(numBots);
  renderBotZones();
  renderBoard();
  renderBoneyard();
  renderHUD();
  document.getElementById('ph').innerHTML = '';

  var tb = document.getElementById('tbadge');
  if (tb) tb.classList.remove('off');

  var fp = G.players[G.cur];
  setSt('🃏', 'Shuffling and dealing tiles…');

  setTimeout(function() {
    renderTurnBadge(fp);
    setSt(fp.id === 0 ? '🎯' : '⏳',
      fp.id === 0
        ? 'You hold the highest double — you go first!'
        : fp.emoji + ' ' + fp.name + ' holds the highest double — they go first.');
    setTimeout(runTurn, 1000);
  }, 600);
}

/* ─────────────────────────────────────────
   LOADING SCREEN
───────────────────────────────────────── */
(function() {
  var bar  = document.getElementById('lbar');
  var txt  = document.getElementById('ltxt');
  var msgs = ['Shuffling tiles…','Polishing the felt…','Waking the bots…','Counting pips…','Ready!'];
  var pct  = 0;
  var iv   = setInterval(function() {
    pct += 5 + Math.random() * 17;
    if (pct > 100) pct = 100;
    bar.style.width = pct + '%';
    txt.textContent = msgs[Math.min(4, Math.floor(pct / 25))];
    if (pct >= 100) {
      clearInterval(iv);
      setTimeout(function() {
        document.getElementById('LS').classList.add('off');
        document.getElementById('MS').classList.remove('off');
        renderDeco();
      }, 340);
    }
  }, 58);
})();
